<!DOCTYPE html>
<html>
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
        <link href="style.css" rel="stylesheet" type="text/css" />
        <style>
            /* CSS */

        </style>

        <title>FP project</title>
    </head>
    <body>
        <!-- HTML -->


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <!-- <script src="script.js"></script> -->
        <script type="module">

            // import kaboom.js
            import kaboom from "https://unpkg.com/kaboom@3000.0.1/dist/kaboom.mjs";
            // JS
            kaboom({
                background: [173, 216, 230],
                // width: 1280,
                // height: 720,
                scale: 1,
            });
            let camTarget = vec2(100, 200)

            loadSprite("rat", "img/sprites/rat.png")
            loadSprite("rat2", "img/sprites/rat2.png")
            loadSprite("sadRat", "img/sprites/rat_lost.png")
            loadSprite("sadRat2", "img/sprites/rat_lost2.png")
            loadSprite("spike", "img/sprites/spike.png")
            loadSprite("grass", "img/sprites/grass.png")
            loadSprite("roc", "img/sprites/hard_grass.png")
            loadSprite("sand", "img/sprites/hardest_grass.png")
            loadSprite("boss", "img/sprites/prize.png")
            loadSprite("portal", "img/sprites/chez.png")
            loadSprite("arrow", "img/sprites/arrow.png")
            loadSprite("iRat", "img/sprites/i_frames.png")
            loadSprite("iRat2", "img/sprites/i_frames2.png")


            setGravity(1600)


            const speed = 500

            const levels = [

                // hardest lvl
                // [
                //     "                 $    $  ^",
                //     "          $           $  ^",
                //     "                 ^    $  ^",
                //     " $        ^      ^       ^",
                //     ". @   ^   ^      ^      }>",
                //     ". . ^^^^^^^^^^^^^^^^^^    ",
                //     ".         }           ^   ",
                //     "......................    ",
                // ],

                // way harder lvls
                [
                    "        $       $        ",
                    "@  }         }          >",
                    "``      ^       ^        ",
                ],

                [
                    "        $       $        ",
                    "@  }         }          >",
                    "``      ^       ^        ",
                ],

                [
                    "`````````````````````",
                    "`@     }    }       >",
                    "```  `  `  `  `  `  `",
                ],
                [
                    "`````````````````````",
                    "`@      }     }     >",
                    "```  ^  ^  ^  ^  ^  `",
                ],
                [
                    "                   `",
                    "                   `",
                    "       $     $     `",
                    "@                  >",
                    "``  ^  ^  ^  ^  ^  `",
                ],
                [
                    "           }",
                    "   }          `    `",
                    "@      `           >",
                    "^^                 ^",
                ],
                [
                    "       $     $     `",
                    "@         ^        >",
                    "``  ^  ^     ^  ^  `",
                ],
                [
                    "       ^         ^         ",
                    "       ^         ^         ",
                    "       ^         ^         ",
                    "@         ^         ^     >",
                    "^``````````````````````````",
                ],

                // norm lvl
                [
                    "====",
                    "=@ =",
                    "== =",
                    " = =",
                    " = =",
                    " = =",
                    " =>=",
                ],
                [
                    "@    }       >",
                    "=========    =",
                ],
                [
                    "@       >",
                    "==  =   =",
                ],
                [
                    "=                ",
                    "=   }    $       ",
                    "=@              >",
                    "===      ^      =",
                ],
                [
                    "==============",
                    "=@     }    >=",
                    "=======^======",
                ],

                [
                    "@      }        }      >",
                    "========================",
                ],
                [
                    "    ^         ^         ",
                    "@      ^         ^     >",
                    "========================",
                ],
                [
                    "@     }              ^ >",
                    "========================",
                ],
                [
                    "@     ^  ^   ^ ^  ^  ^ >",
                    "========================",
                ],
                [
                    ">  }    @  ",
                    "========= ^",
                    "        ^ ^",
                    "        ^^^",
                ],
                [
                    "              >",
                    "         ",
                    "        =",
                    "         ",
                    "    =    ",
                    "        =",
                    "@        ",
                    "=========",
                ],[
                    "=   @   =",
                    "=       =",
                    "=       =",
                    "=       =",
                    "=       =",
                    "=       =",
                    ">       >",
                    "^^^^^^^^^",
                ],

            ]



            scene("game", ({ levelIdx, score, showInstructions}) => {

                let instructionLabel


                camScale(1.5);

                let lives = 2
                let hitCooldown = false
                let hardLvls = false


                const level = addLevel(levels[levelIdx || 0], {
                tileWidth: 64,
                tileHeight: 64,
                pos: vec2(100, 200),
                tiles: {
                    "@": () => [
                        sprite("rat"),
                        area(),
                        body(),
                        anchor("bot"),
                        scale(1),
                        "player",
                    ],
                    ".": () => [
                        sprite("sand"),
                        area(),
                        scale(1),
                        body({ isStatic: true }),
                        anchor("bot"),
                        "sand",
                    ],
                    "`": () => [
                        sprite("roc"),
                        area(),
                        scale(1),
                        body({ isStatic: true }),
                        anchor("bot"),
                        "roc",
                    ],
                    "}": () => [
                        sprite("arrow"),
                        scale(1),
                        anchor("center"),
                        "rArrow",
                    ],
                    "$": () => [
                        sprite("arrow"),
                        scale(1),
                        anchor("center"),
                        rotate(90),
                        "rArrow",
                    ],
                    "=": () => [
                        sprite("grass"),
                        area(),
                        scale(1),
                        body({ isStatic: true }),
                        anchor("bot"),
                        "grass",
                    ],
                    "~": () => [
                        sprite("boss"),
                        area({ width: 10, height: 10 }),
                        anchor("bot"),
                        "boss",
                    ],
                    "^": () => [
                        sprite("spike"),
                        area(),
                        anchor("bot"),
                        body({ isStatic: true }),
                        "danger",
                    ],
                    ">": () => [
                    sprite("portal"),
                    area(),
                    anchor("bot"),
                    "portal",
                    ]
                },
            })
            function jump() {
                // these 2 functions are provided by body() component
                if (player.isGrounded()) {
                    player.jump(speed * 1.5)
                }
            }


                const scoreLabel = add([
                    text("Score: " + score),
                    pos(24, 24),
                    fixed(), // Keeps it fixed on the screen
                    { value: score },
                ]);

                const player = level.get("player")[0]
                const portal = level.get("portal")[0]

                let hoverT = 1
                portal.onUpdate(() => {
                    portal.move(0, Math.sin(time() * 2) * 10)
                })

                player.onCollide("danger", () => {
                    if (!hitCooldown) {
                        if (lives > 1) {
                            lives -= 1
                            player.use(sprite("iRat"))
                            hitCooldown = true
                            wait(2, () => {
                                hitCooldown = false
                            })
                        } else if (lives <= 1) {
                            go("lose", { score: score })
                        }
                    }
                })

                player.onBeforePhysicsResolve((collision) => {
                    if (collision.target.is(["platform", "soft"]) && player.isJumping()) {
                        collision.preventResolution()
                    }
                })

                player.onCollide("portal", () => {
                    let hard = Math.random()*80
                    if(hardLvls = false){
                        score += 1;
                    } else{
                        score += 3;
                    }


                    if (hard < 75) {
                        hardLvls = false
                        const randLvlId = Math.floor(Math.random()*(levels.length-8)+8)
                        go("game", { levelIdx: randLvlId, score: score })
                    } else {
                        console.log("hard lvl")
                        hardLvls = true
                        const randLvlId = Math.floor(Math.random()*8)
                        go("game", { levelIdx: randLvlId, score: score })
                    }

                });


                onKeyDown("a", () => {
                    if(!isKeyDown("left")){
                        player.move(-speed, 0)
                        if (lives < 2) {
                            if(hitCooldown === true){
                                player.use(sprite("iRat2"))
                            } else{
                                player.use(sprite("sadRat2"))
                            }
                        } else{
                            player.use(sprite("rat2"))
                        }
                    }
                })



                onKeyDown("left", () => {
                    if(!isKeyDown("a")){
                        player.move(-speed, 0)
                        if (lives < 2) {
                            if(hitCooldown === true){
                                player.use(sprite("iRat2"))
                            } else{
                                player.use(sprite("sadRat2"))
                            }
                        } else{
                            player.use(sprite("rat2"))
                        }
                    } else{
                        player.move(-speed, 0)
                        if (lives < 2) {
                            player.use(sprite("sadRat2"))
                        } else{
                            player.use(sprite("rat2"))
                        }
                    }
                })


                onKeyDown("d", () => {
                    if(!isKeyDown("right")){
                        player.move(speed, 0)
                        if (lives < 2) {
                            if(hitCooldown === true){
                                player.use(sprite("iRat"))
                            } else{
                                player.use(sprite("sadRat"))
                            }
                        } else{
                            player.use(sprite("rat"))
                        }
                    }
                })

                onKeyDown("right", () => {
                    if(!isKeyDown("d")){
                        player.move(speed, 0)
                        if (lives < 2) {
                            if(hitCooldown === true){
                                player.use(sprite("iRat"))
                            } else{
                                player.use(sprite("sadRat"))
                            }
                        } else{
                            player.use(sprite("rat"))
                        }
                    } else{
                        player.move(speed, 0)
                        if (lives < 2) {
                            if(hitCooldown === true){
                                player.use(sprite("iRat"))
                            } else{
                                player.use(sprite("sadRat"))
                            }
                        } else{
                            player.use(sprite("rat"))
                        }
                    }
                })

                onKeyRelease("right", () => {
                    player.move(speed, 0)
                    if (lives < 2) {
                        if(hitCooldown === true){
                                player.use(sprite("iRat"))
                            } else{
                                player.use(sprite("sadRat"))
                            }
                    } else{
                        player.use(sprite("rat"))
                    }
                })

                onKeyDown("w", jump)
                onKeyDown("up", jump)
                onKeyDown("space", jump)

                // onKeyDown("down", () => {
                //     player.move(0, speed)
                // })

                player.onUpdate(() => {
                    camPos(player.worldPos())
                    if (player.pos.y >= 480) {
                        go("lose", { score: score })
                    }
                })
                if (showInstructions) {
                    instructionLabel = add([
                        text("Use the arrow keys or wasd to move\nW/Space/Up key to jump\nYou can be hit by cats once\nYou get Iframes after getting hit\nGet the chez\nRed grass lvls are harder lvls", {
                            size: 12,
                            lineSpacing: 6,
                        }),
                        pos(-1000, 0),
                        z(0),
                        "instructions",
                    ])
                    // onKeyPress(["a", "d", "w"], () => {
                    //     destroy(instructionLabel)
                    // })
                    instructionLabel.onUpdate(() => {
                        instructionLabel.pos = player.pos.add(0,0)
                    })
                }
            })


            scene("lose", ({ score }) => {

            add([
                text("You Lost With A Score of " + score,),
                pos(width() / 2 - 100, height() / 2 - 20),
                anchor("center"),

            ])

            // Press any key to go back
            onKeyPress(start)

            })
            // debug.inspect = true
            function start() {
                const instructions = add([
                    text("Rat Game Thing\n\nYou are invincible for 2 seconds after getting hit\nA/D to strafe\nW to jump\nAvoid Cats\nReach the Chez", {
                        size: 24,
                        lineSpacing: 10,
                    }),
                    pos(center()),
                    anchor("center"),
                    // color(200,120,208),
                    z(100), // Make sure it’s on top
                    "instructions"
                ])

                go("game", {
                    levelIdx: 12,
                    score: 0,
                    showInstructions: true,
                })
            }

            start()

        </script>
    </body>
</html>
